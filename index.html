<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour Stevyane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital@0;1&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep: #14202b;
    --navy-mid: #1c2f3b;
    --gold: #e2a63f;
    --gold-soft: #f0c877;
    --ivory: #faf3e3;
    --wine: #c9683f;
    --blush: #8ecdc0;
    --star: #fff6e0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy-deep);
    color: var(--ivory);
    font-family: 'EB Garamond', serif;
    overflow-x: hidden;
    scroll-behavior: smooth;
  }

  h1, h2, .display {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .script {
    font-family: 'Parisienne', cursive;
  }

  #sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: radial-gradient(ellipse at 50% 20%, var(--navy-mid) 0%, var(--navy-deep) 70%);
  }

  @keyframes fadeInScene {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .scene {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 6vw;
    opacity: 1;
  }

  .scene.active {
    display: flex;
    animation: fadeInScene 1s ease both;
  }

  @media (prefers-reduced-motion: reduce) {
    .scene.active { animation: none; }
  }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.35em;
    font-size: 0.7rem;
    color: var(--gold-soft);
    margin-bottom: 1.2rem;
    opacity: 0.85;
  }

  .title-hero {
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    font-style: italic;
    margin: 0 0 0.6rem 0;
    color: var(--ivory);
  }

  .subtitle {
    max-width: 480px;
    font-size: 1.15rem;
    line-height: 1.7;
    color: var(--blush);
    margin-bottom: 2.6rem;
  }

  .story-text {
    max-width: 620px;
    font-size: 1.25rem;
    line-height: 1.9;
    color: var(--ivory);
    margin-bottom: 2.6rem;
  }

  .story-text em {
    color: var(--gold-soft);
    font-style: italic;
  }

  button.cta {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-soft);
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 1.05rem;
    padding: 0.85rem 2.4rem;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.4s ease;
  }

  button.cta:hover {
    background: var(--gold);
    color: var(--navy-deep);
    box-shadow: 0 0 30px rgba(226,166,63,0.35);
  }

  button.cta:focus-visible {
    outline: 2px solid var(--star);
    outline-offset: 3px;
  }

  /* Scène : message automatique */
  #phraseText {
    animation: popIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    color: var(--gold-soft);
  }

  /* Feux d'artifice, scène 22 ans */
  #fireworksCanvas {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  #ageNumber {
    position: relative;
    z-index: 3;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(226,166,63,0.5);
    animation: popIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes popIn {
    from { transform: scale(0.4); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  #fireworksScene .subtitle,
  #fireworksScene .eyebrow {
    position: relative;
    z-index: 3;
  }

  /* Letter scene */
  .letter-box {
    max-width: 560px;
    background: rgba(250,243,227,0.04);
    border: 1px solid rgba(226,166,63,0.25);
    border-radius: 4px;
    padding: 3rem 2.6rem;
    text-align: left;
  }

  .letter-box p {
    font-size: 1.18rem;
    line-height: 1.95;
    color: var(--ivory);
    margin: 0 0 1.1rem 0;
  }

  @keyframes fadeInLine {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .letter-line {
    animation: fadeInLine 1s ease both;
  }

  .progress-dots {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 5;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(250,243,227,0.2);
    transition: background 0.4s ease;
  }

  .dot.active {
    background: var(--gold);
  }

</style>
</head>
<body>

<canvas id="sky"></canvas>

<div class="progress-dots" id="progressDots">
  <div class="dot active" data-scene="0"></div>
  <div class="dot" data-scene="1"></div>
  <div class="dot" data-scene="2"></div>
  <div class="dot" data-scene="3"></div>
  <div class="dot" data-scene="4"></div>
</div>

<!-- SCENE 0, Ouverture -->
<section class="scene active" data-index="0">
  <p class="eyebrow">Pour ton anniversaire</p>
  <h1 class="title-hero">Un petit mot pour toi,<br>Stevyane</h1>
  <p class="subtitle">Je voulais prendre un moment pour toi aujourd'hui.</p>
  <button class="cta" data-goto="1">Continuer</button>
</section>

<!-- SCENE 1, Le message -->
<section class="scene" data-index="1">
  <p class="eyebrow" id="phraseEyebrow"></p>
  <h1 class="title-hero" id="phraseText" style="font-size:clamp(2rem,6vw,3.4rem);"></h1>
</section>

<!-- SCENE 2, 22 ans -->
<section class="scene" id="fireworksScene" data-index="2">
  <canvas id="fireworksCanvas"></canvas>
  <p class="eyebrow">Et aujourd'hui</p>
  <h1 class="title-hero" id="ageNumber" style="font-size:clamp(6rem,22vw,11rem); margin:0.2rem 0 0.6rem 0;">22</h1>
  <p class="subtitle">Joyeux anniversaire.</p>
</section>

<!-- SCENE 3, On continue ? -->
<section class="scene" data-index="3">
  <h1 class="title-hero">On continue ?</h1>
  <button class="cta" data-goto="4">Oui</button>
</section>

<!-- SCENE 4, La lettre -->
<section class="scene" data-index="4">
  <div class="letter-box" id="letterBox"></div>
</section>

<script>
  // ---------- Ciel étoilé animé ----------
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({length: 140}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.3 + 0.2,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.015 + 0.005
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  function drawSky(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      const twinkle = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(250, 243, 227, ${0.15 + twinkle * 0.6})`;
      ctx.fill();
    }
    requestAnimationFrame(drawSky);
  }
  requestAnimationFrame(drawSky);

  // ---------- Navigation entre scènes ----------
  const scenes = document.querySelectorAll('.scene');
  const dots = document.querySelectorAll('.dot');

  function goTo(index) {
    scenes.forEach(s => s.classList.remove('active'));
    const next = document.querySelector(`.scene[data-index="${index}"]`);
    next.classList.add('active');

    dots.forEach(d => d.classList.toggle('active', d.dataset.scene == index));

    if (index === 4) renderLetter();
    if (index === 2) { startFireworks(); setTimeout(() => goTo(3), 3600); }
    if (index === 1) initPhrase();
  }

  document.querySelectorAll('[data-goto]').forEach(btn => {
    btn.addEventListener('click', () => goTo(Number(btn.dataset.goto)));
  });

  // ---------- Scène 1 : affichage automatique de la phrase ----------
  const phraseFull = "Joyeux anniversaire, Stevyane.";
  let phraseStarted = false;

  function initPhrase() {
    if (phraseStarted) return;
    phraseStarted = true;
    document.getElementById('phraseEyebrow').textContent = "Un mot pour toi";
    document.getElementById('phraseText').textContent = phraseFull;
    setTimeout(() => goTo(2), 2600);
  }

  // ---------- Feux d'artifice, scène "22 ans" ----------
  const fwCanvas = document.getElementById('fireworksCanvas');
  const fwCtx = fwCanvas.getContext('2d');
  let fwParticles = [];
  let fwRunning = false;
  let fwLastBurst = 0;

  function resizeFw() {
    fwCanvas.width = window.innerWidth;
    fwCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeFw);
  resizeFw();

  function burstFirework() {
    const cx = Math.random() * fwCanvas.width * 0.7 + fwCanvas.width * 0.15;
    const cy = Math.random() * fwCanvas.height * 0.35 + fwCanvas.height * 0.15;
    const colors = ['#e2a63f', '#f0c877', '#c9683f', '#faf3e3', '#8ecdc0'];
    const color = colors[Math.floor(Math.random() * colors.length)];
    const count = 28;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count;
      const speed = Math.random() * 2.4 + 1.2;
      fwParticles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color
      });
    }
  }

  function fwLoop(t) {
    if (!fwRunning) return;
    fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

    if (t - fwLastBurst > 900) {
      burstFirework();
      fwLastBurst = t;
    }

    fwParticles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.02;
      p.life -= 0.012;
      fwCtx.globalAlpha = Math.max(p.life, 0);
      fwCtx.beginPath();
      fwCtx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      fwCtx.fillStyle = p.color;
      fwCtx.fill();
    });
    fwCtx.globalAlpha = 1;
    fwParticles = fwParticles.filter(p => p.life > 0);

    requestAnimationFrame(fwLoop);
  }

  function startFireworks() {
    if (fwRunning) return;
    fwRunning = true;
    fwLastBurst = 0;
    burstFirework();
    requestAnimationFrame(fwLoop);
  }

  function renderLetter() {
    const box = document.getElementById('letterBox');
    if (box.dataset.rendered) return;
    box.dataset.rendered = "true";

    const paragraphs = [
      "Stevyane,",
      "Ma tomate,",
      "Avant tout : joyeux anniversaire. Je voulais marquer cette journée un peu différemment qu'avec un message envoyé à la va-vite, même si je sais qu'on ne s'est pas beaucoup parlé ces derniers temps.",
      "D'ailleurs, ça m'a fait réfléchir. Je ne crois pas qu'une amitié se mesure à la fréquence des messages qu'on s'échange, ce serait la réduire à une simple statistique. Une amitié qui vaut la peine ne se dissout pas parce que le quotidien nous a éloignés un moment, elle reste là, prête à reprendre exactement là où on l'a laissée.",
      "Et en pensant à toi aujourd'hui, ce sont justement ces moments-là qui me reviennent : pas la fréquence de nos échanges, mais certaines discussions précises, une présence au bon moment, des souvenirs qui ont mieux résisté au temps que je ne l'aurais cru.",
      "Alors pour cette nouvelle année qui commence pour toi, je te souhaite sincèrement qu'elle t'apporte tout ce que tu mérites : de nouvelles réussites, des rencontres qui comptent, et des moments qui te ressemblent vraiment.",
      "Et si je peux me permettre un souhait de plus : qu'on retrouve, cette année, l'occasion de se reparler comme avant. Le silence n'a rien enlevé à l'estime que j'ai pour toi, mais j'aimerais qu'on arrête de le laisser s'installer.",
      "Encore une fois, joyeux anniversaire, Stevyane. J'espère que cette journée est à la hauteur de la personne que tu es."
    ];

    paragraphs.forEach((p, idx) => {
      const el = document.createElement('p');
      el.textContent = p;
      el.className = 'letter-line';
      el.style.animationDelay = `${idx * 0.6}s`;
      box.appendChild(el);
    });
  }
</script>

</body>
</html>
